# W.CONTEXT.HOSTED.DEREFERENCES: serve the immutable Infrix DID context with content negotiation.
#
# GitHub Pages (which serves infrix.opendlt.org today) cannot send a Content-Type per path or
# negotiate on Accept. Include this file in the server block of whatever fronts /ns/ (the box
# nginx) and point it at the built site (docs/.vitepress/dist), which contains
# /ns/did/v1.jsonld (the exact pinned bytes) and /ns/did/v1.html (the human page).
#
#   server { ...; include /etc/nginx/snippets/ns-did-v1.conf; }
#
# Verify after deployment with:   infrix did context check <(curl -sH 'Accept: application/ld+json' \
#   https://infrix.opendlt.org/ns/did/v1)      (the check demands the pinned bytes)

map $http_accept $infrix_ns_did_v1_target {
    default                 /ns/did/v1.jsonld;
    "~*text/html"           /ns/did/v1.html;
}

location = /ns/did/v1 {
    # Both representations are served under one URL, so caches must key on Accept.
    add_header Vary "Accept" always;
    # The version is in the URL and the bytes never change.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    # JSON-LD processors in browsers fetch contexts cross-origin.
    default_type application/ld+json;
    try_files $infrix_ns_did_v1_target =404;
}

location = /ns/did/v1.jsonld {
    default_type application/ld+json;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
}
